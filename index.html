<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Flamingo Exporter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            color: white;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button {
            background: #ff8da1;
            border: none;
            color: black;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background: #ffb6c1;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h2>Flamingo Generator</h2>
        <p>Left-click + Drag to rotate view</p>
        <button id="export-btn">Download .GLTF Model</button>
    </div>

    <!-- 1. Load standalone, production-ready Three.js ecosystem bundles via standard scripts -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        // 2. Initialize the standard canvas elements
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        // 3. Add global environment lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 4. Build structural flamingo nodes
        const pinkMaterial = new THREE.MeshStandardMaterial({ color: 0xff8da1, roughness: 0.6 });
        const orangeMaterial = new THREE.MeshStandardMaterial({ color: 0xffa500 });
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0xffb6c1 });

        const bodyGeo = new THREE.SphereGeometry(1, 16, 16);
        const body = new THREE.Mesh(bodyGeo, pinkMaterial);
        body.scale.set(1.5, 1, 1);
        scene.add(body);

        const neckGeo = new THREE.CylinderGeometry(0.15, 0.2, 1.5, 8);
        const neck = new THREE.Mesh(neckGeo, pinkMaterial);
        neck.position.set(1.2, 0.8, 0);
        neck.rotation.z = -0.3;
        scene.add(neck);

        const headGeo = new THREE.SphereGeometry(0.3, 12, 12);
        const head = new THREE.Mesh(headGeo, pinkMaterial);
        head.position.set(1.4, 1.6, 0);
        scene.add(head);

        const beakGeo = new THREE.ConeGeometry(0.1, 0.4, 8);
        const beak = new THREE.Mesh(beakGeo, orangeMaterial);
        beak.position.set(1.6, 1.5, 0);
        beak.rotation.z = -1.2;
        scene.add(beak);

        const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 2, 8);
        const leftLeg = new THREE.Mesh(legGeo, legMaterial);
        leftLeg.position.set(0, -1.8, 0.2);
        scene.add(leftLeg);

        // 5. Establish camera perspective view matrixes
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3, 2, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 6. Hook up the interactive mouse controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 7. Core execution loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Window resize adaptation
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. Handle explicit click file generation
        document.getElementById('export-btn').addEventListener('click', () => {
            const exporter = new THREE.GLTFExporter(); // Standard object scope instantiation
            exporter.parse(scene, function (gltf) {
                const output = JSON.stringify(gltf, null, 2);
                const blob = new Blob([output], { type: 'application/json' });
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'flamingo.gltf';
                link.click();
            });
        });
    </script>
</body>
</html>
