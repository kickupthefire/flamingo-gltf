<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js Flamingo Exporter</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: sans-serif;
            color: white;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;

            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 8px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);

            width: 220px;
        }

        #ui-container h2 {
            margin-top: 0;
        }

        button {
            background: #ff8da1;
            border: none;
            color: black;

            padding: 12px 20px;

            font-weight: bold;

            border-radius: 4px;

            cursor: pointer;

            margin-top: 10px;

            width: 100%;
        }

        button:hover {
            background: #ffb6c1;
        }
    </style>

    <!--
        Import map for modern Three.js ES modules.
    -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="ui-container">
        <h2>Flamingo Generator</h2>

        <p>Left-click + drag to rotate</p>
        <p>Scroll to zoom</p>

        <button id="export-btn">
            Download .GLTF Model
        </button>
    </div>


    <!--
        IMPORTANT:
        This must be type="module".
    -->
    <script type="module">

        import * as THREE from "three";

        import { OrbitControls }
            from "three/addons/controls/OrbitControls.js";

        import { GLTFExporter }
            from "three/addons/exporters/GLTFExporter.js";


        // ============================================================
        // SCENE
        // ============================================================

        const scene = new THREE.Scene();

        scene.background =
            new THREE.Color(0x1a1a1a);


        // ============================================================
        // CAMERA
        // ============================================================

        const camera =
            new THREE.PerspectiveCamera(
                45,
                window.innerWidth /
                window.innerHeight,
                0.1,
                100
            );

        camera.position.set(
            4,
            2,
            7
        );


        // ============================================================
        // RENDERER
        // ============================================================

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        document.body.appendChild(
            renderer.domElement
        );


        // ============================================================
        // LIGHTING
        // ============================================================

        const ambientLight =
            new THREE.AmbientLight(
                0xffffff,
                0.8
            );

        scene.add(ambientLight);


        const directionalLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.5
            );

        directionalLight.position.set(
            5,
            10,
            7
        );

        scene.add(directionalLight);


        // ============================================================
        // MATERIALS
        // ============================================================

        const pinkMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xff8da1,
                roughness: 0.6
            });


        const darkPinkMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xe75480,
                roughness: 0.6
            });


        const orangeMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xffa500,
                roughness: 0.5
            });


        const blackMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x222222
            });


        const legMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xffb6c1,
                roughness: 0.6
            });


        // ============================================================
        // FLAMINGO GROUP
        // ============================================================

        const flamingo =
            new THREE.Group();

        scene.add(flamingo);


        // ============================================================
        // BODY
        // ============================================================

        const bodyGeometry =
            new THREE.SphereGeometry(
                1,
                32,
                24
            );

        const body =
            new THREE.Mesh(
                bodyGeometry,
                pinkMaterial
            );

        body.scale.set(
            1.5,
            1,
            0.8
        );

        flamingo.add(body);


        // ============================================================
        // NECK
        // ============================================================

        const neckGeometry =
            new THREE.CylinderGeometry(
                0.15,
                0.20,
                1.8,
                16
            );

        const neck =
            new THREE.Mesh(
                neckGeometry,
                pinkMaterial
            );

        neck.position.set(
            1.1,
            1.15,
            0
        );

        neck.rotation.z = -0.25;

        flamingo.add(neck);


        // ============================================================
        // HEAD
        // ============================================================

        const headGeometry =
            new THREE.SphereGeometry(
                0.32,
                24,
                20
            );

        const head =
            new THREE.Mesh(
                headGeometry,
                pinkMaterial
            );

        head.position.set(
            1.55,
            2.05,
            0
        );

        flamingo.add(head);


        // ============================================================
        // EYE
        // ============================================================

        const eyeGeometry =
            new THREE.SphereGeometry(
                0.055,
                16,
                16
            );

        const eye =
            new THREE.Mesh(
                eyeGeometry,
                blackMaterial
            );

        eye.position.set(
            1.76,
            2.12,
            0.27
        );

        flamingo.add(eye);


        // ============================================================
        // BEAK
        // ============================================================

        const beakGeometry =
            new THREE.ConeGeometry(
                0.13,
                0.55,
                12
            );

        const beak =
            new THREE.Mesh(
                beakGeometry,
                orangeMaterial
            );

        beak.position.set(
            1.88,
            1.98,
            0
        );

        beak.rotation.z =
            -Math.PI / 2;

        flamingo.add(beak);


        // ============================================================
        // BLACK BEAK TIP
        // ============================================================

        const beakTipGeometry =
            new THREE.ConeGeometry(
                0.14,
                0.20,
                12
            );

        const beakTip =
            new THREE.Mesh(
                beakTipGeometry,
                blackMaterial
            );

        beakTip.position.set(
            2.13,
            1.98,
            0
        );

        beakTip.rotation.z =
            -Math.PI / 2;

        flamingo.add(beakTip);


        // ============================================================
        // LEGS
        // ============================================================

        const legGeometry =
            new THREE.CylinderGeometry(
                0.055,
                0.055,
                2.2,
                12
            );


        const leftLeg =
            new THREE.Mesh(
                legGeometry,
                legMaterial
            );

        leftLeg.position.set(
            -0.45,
            -1.45,
            0.25
        );

        flamingo.add(leftLeg);


        const rightLeg =
            new THREE.Mesh(
                legGeometry,
                legMaterial
            );

        rightLeg.position.set(
            0.35,
            -1.45,
            -0.20
        );

        flamingo.add(rightLeg);


        // ============================================================
        // FEET
        // ============================================================

        const footGeometry =
            new THREE.BoxGeometry(
                0.5,
                0.08,
                0.15
            );


        const leftFoot =
            new THREE.Mesh(
                footGeometry,
                legMaterial
            );

        leftFoot.position.set(
            -0.45,
            -2.55,
            0.30
        );

        flamingo.add(leftFoot);


        const rightFoot =
            new THREE.Mesh(
                footGeometry,
                legMaterial
            );

        rightFoot.position.set(
            0.35,
            -2.55,
            -0.15
        );

        flamingo.add(rightFoot);


        // ============================================================
        // WING
        // ============================================================

        const wingGeometry =
            new THREE.SphereGeometry(
                0.8,
                24,
                16
            );

        const wing =
            new THREE.Mesh(
                wingGeometry,
                darkPinkMaterial
            );

        wing.scale.set(
            1.1,
            0.35,
            0.7
        );

        wing.position.set(
            -0.25,
            0.25,
            0.7
        );

        wing.rotation.z =
            -0.25;

        flamingo.add(wing);


        // ============================================================
        // CENTER MODEL
        // ============================================================

        flamingo.position.set(
            0,
            0.5,
            0
        );


        // ============================================================
        // ORBIT CONTROLS
        // ============================================================

        const controls =
            new OrbitControls(
                camera,
                renderer.domElement
            );

        controls.enableDamping = true;

        controls.dampingFactor = 0.05;

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();


        // ============================================================
        // ANIMATION
        // ============================================================

        function animate() {

            requestAnimationFrame(
                animate
            );

            controls.update();

            renderer.render(
                scene,
                camera
            );
        }

        animate();


        // ============================================================
        // RESIZE
        // ============================================================

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );


        // ============================================================
        // GLTF EXPORT
        // ============================================================

        document
            .getElementById("export-btn")
            .addEventListener(
                "click",
                () => {

                    const exporter =
                        new GLTFExporter();


                    exporter.parse(
                        flamingo,

                        function (result) {

                            const output =
                                JSON.stringify(
                                    result,
                                    null,
                                    2
                                );


                            const blob =
                                new Blob(
                                    [output],
                                    {
                                        type:
                                            "application/json"
                                    }
                                );


                            const url =
                                URL.createObjectURL(
                                    blob
                                );


                            const link =
                                document.createElement(
                                    "a"
                                );

                            link.href = url;

                            link.download =
                                "flamingo.gltf";


                            document.body.appendChild(
                                link
                            );

                            link.click();

                            document.body.removeChild(
                                link
                            );


                            URL.revokeObjectURL(
                                url
                            );
                        },

                        function (error) {

                            console.error(
                                "GLTF export failed:",
                                error
                            );
                        }
                    );
                }
            );

    </script>

</body>
</html>
