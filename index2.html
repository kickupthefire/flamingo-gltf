 <!DOCTYPE html>
<html>
<head>
    <title>Page Title</title>
    <!-- 1. Import the model-viewer library -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/{{MODELVIEWER_VERSION}}/model-viewer.min.js"></script>
    
    <!-- 2. Give the viewer a size -->
    <style>
        model-viewer {
            width: 100%;
            height: 500px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

<h1>This is a Heading</h1>
<p>This is a paragraph.</p>


<model-viewer src="flamingo.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" exposure="1" shadow-softness="1">
    <button class="Hotspot" slot="hotspot-1" data-position="8m 41.92445869436338m -1.0773915872023423m" data-normal="-1m 0m 0m" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">wing
        </div>
    </button><button class="Hotspot" slot="hotspot-3" data-position="11.316871676854333m 21m -4.263258929998657m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">leg</div>
    </button>
    <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
    </div>
    <button slot="ar-button" id="ar-button">
        View in your space
    </button>
    <div id="ar-prompt">
        <img src="https://modelviewer.dev/shared-assets/icons/hand.png">
    </div>
</model-viewer>


</body>
</html>
